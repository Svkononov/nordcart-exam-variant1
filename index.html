<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NordCart — каталог</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header><a class="logo" href="index.html">NordCart</a><form id="searchForm" class="search"><label class="sr-only" for="search">Поиск товаров</label><input id="search" autocomplete="off" placeholder="Найти товар"><button>Найти</button><div id="suggestions" class="suggestions" role="listbox"></div></form><nav><a href="cart.html">🛒 Корзина <span id="cartCount">0</span></a><a href="account.html">👤 Личный кабинет</a></nav></header><div id="notice" class="notice" role="status"></div><main class="layout"><aside><h2>Фильтры</h2><form id="filters"><fieldset><legend>Категории</legend><div id="categories"></div></fieldset><label>Цена от<input id="priceFrom" type="number" min="0"></label><label>Цена до<input id="priceTo" type="number" min="0"></label><label class="check"><input id="discountOnly" type="checkbox"> Только со скидкой</label><button>Применить</button></form></aside><section class="catalog"><div class="catalog-head"><div><p class="eyebrow">NORDIC MARKET</p><h1>Каталог</h1></div><label>Сортировка<select id="sort"><option value="rating_desc">Рейтинг: сначала лучшие</option><option value="rating_asc">Рейтинг: сначала ниже</option><option value="price_asc">Цена: по возрастанию</option><option value="price_desc">Цена: по убыванию</option></select></label></div><div id="products" class="products" aria-live="polite"></div></section></main><footer>NordCart · Москва · hello@nordcart.ru</footer></div><script src="runtime.js"></script></body></html>
